# Local/all-in-one gateway config. Uses Docker Compose service names instead of
# VM private IPs, so `docker compose up` at the repo root gives you one origin
# on http://localhost:8080 that fronts all three services + the UI.
#
# NOTE: we deliberately do NOT use `upstream { server name; }` blocks here.
# Nginx resolves those names once, at startup, and exits hard if any backend
# isn't up yet ("host not found in upstream ..."). The slow Java wallet service
# would take the whole gateway down with it. Instead we resolve service names at
# REQUEST time through Docker's embedded DNS (127.0.0.11), so the gateway always
# boots; a backend that is down simply returns 502 until it is ready.

events {}

http {
  # Docker's embedded DNS server. valid=10s re-resolves as containers restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Putting the target in a variable forces per-request resolution.
    # $request_uri preserves the full original path (and query string), which is
    # what each backend expects (e.g. the wallet controller is mounted at
    # /api/wallet).
    location /api/wallet/ {
      set $svc_wallet wallet:8081;
      proxy_pass http://$svc_wallet$request_uri;
    }
    location /api/drivers/ {
      set $svc_drivers drivers:8082;
      proxy_pass http://$svc_drivers$request_uri;
    }
    location /api/tracking/ {
      set $svc_tracking tracking:8083;
      proxy_pass http://$svc_tracking$request_uri;
    }
    location /api/metadata {
      return 301 /api/metadata/;
    }
    location /api/metadata/ {
      set $svc_metadata metadata:8084;
      proxy_pass http://$svc_metadata$request_uri;
    }
    location / {
      set $svc_web web:80;
      proxy_pass http://$svc_web$request_uri;
    }
  }
}
